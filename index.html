<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
		<meta http-equiv="Content-Security-Policy" content="img-src 'self' data:">
		<!-- Third-party libraries -->
		<script type="text/javascript" src="./engine/lib/pace/pace.min.js"></script>
		<link href="./engine/lib/pace/pace.css" rel="stylesheet" />
		<link href="./engine/lib/XP.css" rel="stylesheet" />
		<script type="text/javascript" src="./engine/lib/pizzicato.min.js"></script>
		<script type="text/javascript" src="./engine/lib/gamepad.js"></script>
		<script type="text/javascript" src="./engine/lib/mousetrap.js"></script>
		<script type="text/javascript" src="./engine/lib/camera.js"></script>
		<script type="text/javascript" src="./engine/lib/GIF.js"></script>
		<script type="text/javascript" src="./engine/lib/easystar-0.4.3.js"></script>
		<!-- Engine: loaded before the page so assets load during the loading bar -->
		<script type="text/javascript" src="./engine/util/Maths.js"></script>
		<script type="text/javascript" src="./engine/assets/Sound.js"></script>
		<script type="text/javascript" src="./engine/assets/LoadImage.js"></script>
		<script type="text/javascript" src="./engine/assets/LoadAssets.js"></script>
		<script type="text/javascript" src="./engine/core/setup.js"></script>
		<link rel="stylesheet" type="text/css" href="./engine/ui/styles.css" />
		<title>Windows Defender</title>
	</head>
	<body id="body">
		<div class="title-bar" id="main-title-bar">
		  <div class="title-bar-text">Windows Defender</div>
		  <div class="title-bar-controls">
		    <button aria-label="Minimize" id="title-bar-minimize"></button>
		    <button aria-label="Maximize" id="title-bar-maximize"></button>
		    <button aria-label="Close" id="title-bar-close"></button>
		  </div>
		</div>
		<div id="canvas-div"></div>
		<div id="pause-window" class="window" style="width: 400px">
			<div id="pause-window-title-bar" class="title-bar">
				<div class="title-bar-text">Settings</div>
				<div class="title-bar-controls">
					<button id="pause-window-min" aria-label="Minimize"></button>
					<button id="pause-window-max" aria-label="Maximize"></button>
					<button id="pause-window-close" aria-label="Close"></button>
				</div>
			</div>
			<div class="window-body">
				<menu role="tablist">
					<button aria-selected="true" aria-controls="music">Music</button>
				</menu>
				<article role="tabpanel" id="music">
					<p>Set your listening preferences</p>
					<fieldset>
						<legend>Device Volume</legend>
						<div class="field-row" style="width: 300px">
							<label for="range25">Audio:</label>
							<label for="range26">Low</label>
							<input id="audio-slider" type="range" min="0" max="100" value="100" />
							<label for="range27">High</label>
						</div>
						<div class="field-row" style="width: 300px">
							<label for="range25">Music: </label>
							<label for="range26">Low</label>
							<input id="music-slider" type="range" min="0" max="100" value="100" />
							<label for="range27">High</label>
						</div>
					</fieldset>
					<section class="field-row">
						<button>Reset Alarm...</button>
						<label>Try this to get some attention</label>
					</section>
				</article>
				<section class="field-row" style="justify-content: flex-end">
					<button>OK</button>
					<button>Cancel</button>
				</section>
			</div>
		</div>
		<!-- Engine: load order matters, anything a file uses at load time must come before it -->
		<script type="text/javascript" src="./engine/input/Controller.js"></script>
		<script type="text/javascript" src="./engine/entities/Entity.js"></script>
		<script type="text/javascript" src="./engine/entities/Creature.js"></script>
		<script type="text/javascript" src="./engine/core/Timer.js"></script>
		<script type="text/javascript" src="./engine/util/Vector.js"></script>
		<script type="text/javascript" src="./engine/systems/Collision.js"></script>
		<script type="text/javascript" src="./engine/systems/CollisionBody.js"></script>
		<script type="text/javascript" src="./engine/systems/BackgroundManager.js"></script>
		<script type="text/javascript" src="./engine/systems/SpatialGrid.js"></script>
		<script type="text/javascript" src="./engine/systems/EntityManager.js"></script>
		<script type="text/javascript" src="./engine/systems/Tile.js"></script>
		<script type="text/javascript" src="./engine/systems/ParticleSystem.js"></script>
		<script type="text/javascript" src="./engine/systems/Particle.js"></script>
		<script type="text/javascript" src="./engine/weapons/Gun.js"></script>
		<script type="text/javascript" src="./engine/entities/Bullet.js"></script>
		<script type="text/javascript" src="./engine/entities/Explosion.js"></script>
		<script type="text/javascript" src="./engine/entities/Turret.js"></script>
		<script type="text/javascript" src="./engine/entities/Enemy.js"></script>
		<script type="text/javascript" src="./engine/entities/Powerup.js"></script>
		<script type="text/javascript" src="./engine/systems/EnemySpawner.js"></script>
		<script type="text/javascript" src="./engine/entities/Player.js"></script>
		<script type="text/javascript" src="./engine/weapons/Inventory.js"></script>
		<script type="text/javascript" src="./engine/ui/StatBar.js"></script>
		<script type="text/javascript" src="./engine/core/Game.js"></script>
		<script type="text/javascript" src="./engine/input/KeyBinds.js"></script>
		<script type="text/javascript" src="./engine/core/Level.js"></script>
		<!-- Game: states and levels, then config.js last -->
		<script type="text/javascript" src="./game/states/DeathScreen01.js"></script>
		<script type="text/javascript" src="./game/levels/WindowsDefender.js"></script>
		<script type="text/javascript" src="./game/levels/Reskin.js"></script>
		<script type="text/javascript" src="./game/config.js"></script>
	</body>
</html>
